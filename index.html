<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Digital Payments Usage and Security Concerns in Local Kirana Stores — trilingual survey in English, Hindi and Marathi." />
  <meta name="theme-color" content="#4338ca" />
  <title>Kirana Pay Survey | किराना पे सर्वेक्षण | किराणा पे सर्वेक्षण</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#app" id="skipLink">Skip to survey</a>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <!-- Wallet / UPI icon (inline SVG, no external dependency) -->
        <span class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" focusable="false" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h11A2.5 2.5 0 0 1 19 7.5V17a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 3 17v-9.5Z"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 9.5h16"/>
            <circle cx="17" cy="14.5" r="1.4" fill="currentColor"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 14.5h4"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name" id="brandName">Kirana Pay Survey</span>
          <span class="brand-sub" id="brandSub">Kirana stores · UPI · Safety</span>
        </span>
      </div>

      <nav class="lang-switch" aria-label="Choose language / भाषा चुनें / भाषा निवडा">
        <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true">English</button>
        <button type="button" class="lang-btn" data-lang="hi" aria-pressed="false">हिंदी</button>
        <button type="button" class="lang-btn" data-lang="mr" aria-pressed="false">मराठी</button>
      </nav>
    </div>
  </header>

  <main id="app" class="app-main" tabindex="-1">
    <noscript>
      <section class="card">
        <h1>Kirana Pay Survey</h1>
        <p>Please enable JavaScript to take this survey. / कृपया सर्वेक्षण के लिए JavaScript चालू करें। / कृपया सर्वेक्षणासाठी JavaScript चालू करा.</p>
      </section>
    </noscript>
  </main>

  <footer class="app-footer">
    <p id="footerText">Anonymous survey for study purposes only. Your details are never shared. 🔒</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
